# Curated Coolify API subset for the Workspace MVP.
#
# upstream repository: coollabsio/coolify
# upstream commit:     59edffd024875f765afa1c6c9bb22164a797ee76
# upstream path:       openapi.yaml (snapshot)
#
# Local corrections applied on top of the upstream contract:
#   - typed Database response for GET /databases/{uuid} (upstream declares a string placeholder),
#     including engine-specific root/user/password/database fields for both MySQL and MariaDB
#     so the workspace service can derive the admin connection from the shared resource
#   - CreatedResource {uuid} responses for create database + create dockerimage application
#   - typed StorageList / PersistentStorage for GET /applications/{uuid}/storages
#   - DeploymentStart {deployment_uuid} for POST /applications/{uuid}/start
#   - added GET /applications (typed, tag filter) and GET /health
#   - application/database tags accepted on create and persisted (v4.3.19
#     HandlesTagsApi) plus the server-side GET /applications?tag=... filter
#   - POST verbs retained for start/stop (Coolify 4.2+)
#   - bulk env update as PATCH { data: [...] }
#   - structured 409 domain conflicts and Laravel-style 422 validation errors
#
# Generated by: oapi-codegen (see config.yaml). Do not edit client.gen.go by hand.
