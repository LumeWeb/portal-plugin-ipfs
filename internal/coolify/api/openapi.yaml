                  type: string
                  description: The Docker Compose location.
                docker_compose_custom_start_command:
                  type: string
                  description: The Docker Compose custom start command.
                docker_compose_custom_build_command:
                  type: string
                  description: The Docker Compose custom build command.
                docker_compose_domains:
                  type: array
                  description: Array of URLs to be applied to containers of a dockercompose
                    application.
                  items:
                    properties:
                      name:
                        type: string
                        description: The service name as defined in docker-compose.
                      domain:
                        type: string
                        description: Comma-separated list of URLs (e.g. "https://app.coolify.io,https://app2.coolify.io")
                      redirect:
                        type: string
                        nullable: true
                        description: Per-service www/non-www redirect for this compose
                          service.
                        enum:
                        - www
                        - non-www
                        - both
                    type: object
                watch_paths:
                  type: string
                  description: The watch paths.
                use_build_server:
                  type: boolean
                  nullable: true
                  description: Use build server.
                use_build_secrets:
                  type: boolean
                  description: Use Docker Build Secrets for build-time environment
                    variables.
                is_git_submodules_enabled:
                  type: boolean
                  description: Clone Git submodules.
                is_git_lfs_enabled:
                  type: boolean
                  description: Enable Git LFS.
                is_git_shallow_clone_enabled:
                  type: boolean
                  description: Use a shallow Git clone.
                disable_build_cache:
                  type: boolean
                  description: Disable the build cache.
                inject_build_args_to_dockerfile:
                  type: boolean
                  description: Inject build arguments into the Dockerfile build.
                include_source_commit_in_build:
                  type: boolean
                  description: Include the source commit in the build.
                is_env_sorting_enabled:
                  type: boolean
                  description: Sort environment variables.
                is_pr_deployments_public_enabled:
                  type: boolean
                  description: Make pull request deployments public.
                stop_grace_period:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 3600
                  description: Container stop grace period in seconds.
                docker_images_to_keep:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Number of Docker images to retain.
                is_gzip_enabled:
                  type: boolean
                  description: Enable gzip compression.
                is_stripprefix_enabled:
                  type: boolean
                  description: Enable path prefix stripping.
                is_raw_compose_deployment_enabled:
                  type: boolean
                  description: Deploy the raw Docker Compose definition.
                is_log_drain_enabled:
                  type: boolean
                  description: Enable log drain for the application.
                is_gpu_enabled:
                  type: boolean
                  description: Enable GPU support.
                gpu_driver:
                  type: string
                  nullable: true
                  description: GPU driver name.
                gpu_count:
                  type: string
                  nullable: true
                  description: Number of GPUs to allocate.
                gpu_device_ids:
                  type: string
                  nullable: true
                  description: Comma-separated GPU device IDs.
                gpu_options:
                  type: string
                  nullable: true
                  description: Additional GPU options.
                is_consistent_container_name_enabled:
                  type: boolean
                  description: Use a consistent container name across deployments.
                custom_internal_name:
                  type: string
                  nullable: true
                  description: Custom internal container name.
                preview_url_template:
                  type: string
                  description: Preview URL template.
                max_restart_count:
                  type: integer
                  minimum: 0
                  description: Maximum container restart count before stopping.
                connect_to_docker_network:
                  type: boolean
                  description: The flag to connect the service to the predefined Docker
                    network.
                force_domain_override:
                  type: boolean
                  description: Force domain usage even if conflicts are detected.
                    Default is false.
                is_container_label_escape_enabled:
                  type: boolean
                  default: true
                  description: Escape special characters in labels. By default, $
                    (and other chars) is escaped. So if you write $ in the labels,
                    it will be saved as $$. If you want to use env variables inside
                    the labels, turn this off.
                is_preserve_repository_enabled:
                  type: boolean
                  description: Preserve git repository during application update.
                    If false, the existing repository will be removed and replaced
                    with the new one. If true, the existing repository will be kept
                    and the new one will be ignored. Default is false.
              type: object
      responses:
        '200':
          description: Application updated.
          content:
            application/json:
              schema:
                properties:
                  uuid:
                    type: string
                type: object
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: Domain conflicts detected.
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                    example: Domain conflicts detected. Use force_domain_override=true
                      to proceed.
                  warning:
                    type: string
                    example: Using the same domain for multiple resources can cause
                      routing conflicts and unpredictable behavior.
                  conflicts:
                    type: array
                    items:
                      properties:
                        domain:
                          type: string
                          example: example.com
                        resource_name:
                          type: string
                          example: My Application
                        resource_uuid:
                          type: string
                          nullable: true
                          example: abc123-def456
                        resource_type:
                          type: string
                          enum:
                          - application
                          - service
                          - instance
                          example: application
                        message:
                          type: string
                          example: Domain example.com is already in use by application
                            'My Application'
                      type: object
                type: object
      security:
      - bearerAuth: []
