template: testify
template-data:
  unroll-variadic: true
filename: "Mock{{.InterfaceName}}.go"
pkgname: "mocks"
dir: ./internal/testing/mocks
packages:
  go.lumeweb.com/portal-plugin-ipfs/internal/service/domain:
    interfaces:
      DomainProvider: {}
      DNSZoneService: {}
  go.lumeweb.com/portal-plugin-ipfs/core:
    interfaces:
      Provider: {}
      ReprovideStore: {}
      MetadataStore: {}
      BlockDownloader: {}
      IPFSPinService: {}
      UploadService: {}
      BlockService: {}
      FileManagerService: {}
      IPNSKeyService: {}
      WebsiteService: {}
      IPNSPublisher: {}
      DNSService: {}
  github.com/ipfs/boxo/keystore:
    interfaces:
      Keystore: {}
  github.com/ipfs/go-datastore:
    interfaces:
      Datastore: {}
  go.lumeweb.com/portal-plugin-ipfs/internal/protocol:
    config:
      pkgname: protocoltestmocks
      dir: ./internal/protocol/mock_tests
    interfaces:
      ProtoNode: {}
      BlockProcessor: {}
  go.lumeweb.com/portal-plugin-ipfs/internal/protocol/ipfs:
    interfaces:
      IPFSNode: {}
  go.lumeweb.com/portal-plugin-ipfs/internal/protocol/store:
    interfaces:
      MockBlockstore: {}
      MockDatastore: {}
  go.lumeweb.com/portal-plugin-ipfs/internal/upload:
    config:
      pkgname: "{{.SrcPackageName}}"
      dir: "{{.InterfaceDir}}"
    interfaces:
      StreamingArchiveProcessor: {}
  go.lumeweb.com/portal-plugin-ipfs/internal/service/dns:
    interfaces:
      DNSLookup: {}
  go.lumeweb.com/portal-plugin-ipfs/internal/service/website:
    interfaces:
      DNSResolver: {}
